<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="author" content="BARMALEI">
        <meta name="description" content="ТЕСТОВАЯ страница">
        <meta name="keywords" content="Тест,Проверка,html">
        <title>Главная страница!</title>
    </head>

    <body>
        <ol start="2" type="a"> <!-- контейнер, который создаёт упорядоченный (нумерованный) список --> <!--атрибут указывает с какой цифры страт список-->
            <li><big><i>Купи картошку</i></big></li> <!--это элемент списка-->
            <li><b>Купи молоко <small>1л</small></b></li>
            <li><strike>Купи карту</strike></li>
        </ol>

        <ul> <!-- контейнер, который создаёт не номерованный список -->
            <li><big><i>Купи картошку</i></big></li> <!--это элемент списка-->
            <li><b>Купи молоко <small>1л</small></b></li>
            <li><strike>Купи карту</strike></li>
        </ul>

        <ol start="5">
            <li>Качать пресс</li>
            <li>Качать тело</li>
            <li>Качать ноги</li>
        </ol>
    </body>
</html>
