<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="author" content="BARMALEI">
        <meta name="description" content="Тестовая страница!">
        <meta name="keywords" content="Тест,Проверка,HTML">
        <title>Главаня страница!</title>
    </head>
    <body>
        <form action="" method="post"> <!--контейнер для работы с формами-->
            <label for="user_name">Введите имя</label>
            <input type="text" placeholder="Введите что-то" maxlength="10" name="user_name" id="user_name"><br><br> <!--для создания текстового поля-->

            <label for="user_pass" >Пароль</label>
            <input type="password" placeholder="Введите пароль" maxlength="5" name="user_pass" id="user_pass"> <br><br><!--для создания поля пароля-->

            <label for="user_email">Email</label>
            <input type="email" placeholder="Введите почту" maxlength="20" name="user_email" id="user_email"><br><br><!--для создания поля почты-->

            <input type="color"><!--для создания поля для выбора цвета-->

            <input type="date"> <!--для создания поля для выбора даты-->

            <input type="time"><br><br><!--для создания поля для выбора времени-->

            <input type="checkbox"><!--для создания поля с галкой-->

            <input type="radio" name="state">
            <input type="radio" name="state"><br><br> 

            <input type="file"> <!--для создания поля выбора файла-->

            <input type="button" name="" id=""> <!--для создания кнопки-->

            <input type="submit" value="обновить"> <!--для создания кнопки обовнления стр-->

            <input type="reset" value="очистить"><br><br> <!--для создания кнопки очистки полей-->

            <textarea placeholder="Введите Тест"></textarea><br><br>

            <button type="reset">Готово</button>

            <select>
                <option disabled>Марки</option>
                <option>BMW</option>
                <option>Audi</option>
                <option selected>Mercedes</option>
            </select>

        </form>
    </body>
</html>
